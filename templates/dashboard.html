{% extends "layout.html" %}
{% block content %}

<h2>Dashboard</h2>

<!-- TOTAL -->
<div class="card">
    <h5>Total Spent</h5>
    <div class="highlight">₹{{ "{:,.0f}".format(total) }}</div>
</div>

<!-- CHARTS -->
<div class="grid">

    <div class="card">
        <h5>Category Distribution</h5>
        {% if category_data %}
            <img src="{{ url_for('static', filename=pie_file) }}?v={{ version }}">
        {% else %}
            <p>No expense data yet.</p>
        {% endif %}
    </div>

    <div class="card">
        <h5>Monthly Trend</h5>
        <img src="{{ url_for('static', filename=bar_file) }}?v={{ version }}">    </div>

</div>

{% endblock %}
